<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>TrilhaFIT - Relatorio</title>
</head>
<body>
    <div class="app-wrapper">
        <div style="background: linear-gradient(135deg, #FF5C00 0%, #FF8A3D 100%); max-width: 390px; width: 100%; margin: 0 auto; padding: 0; min-height: 100%; display: flex; flex-direction: column; position: relative; z-index: 1;">
            <div style="flex: 1; overflow-y: auto;">
                <div style="padding: 24px 20px;">
                    <h2 style="font-size: 24px; font-weight: 800; color: #FFFFFF; margin-bottom: 20px; text-shadow: 0 2px 8px rgba(0,0,0,0.15);">Relatório do Treino</h2>
                    <div style="background: rgba(255, 255, 255, 0.95); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px);">
                        <div style="margin-bottom: 24px;">
                            <p style="font-size: 12px; font-weight: 600; color: #FF5C00; margin-bottom: 12px;">Última sessão</p>
                            <p style="font-size: 13px; color: #666;">Hoje às 14:30</p>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
                            <div style="background: #fff5f0; border-radius: 12px; padding: 16px; border-left: 4px solid #FF5C00;">
                                <div style="font-size: 12px; font-weight: 600; color: #FF5C00; margin-bottom: 8px;">RPM</div>
                                <div style="font-size: 28px; font-weight: 800; color: #1A1A1A;">85</div>
                                <div style="font-size: 12px; color: #999; margin-top: 4px;">rotações/min</div>
                            </div>
                            <div style="background: #fff5f0; border-radius: 12px; padding: 16px; border-left: 4px solid #FF5C00;">
                                <div style="font-size: 12px; font-weight: 600; color: #FF5C00; margin-bottom: 8px;">Distância</div>
                                <div style="font-size: 28px; font-weight: 800; color: #1A1A1A;">12.5</div>
                                <div style="font-size: 12px; color: #999; margin-top: 4px;">quilômetros</div>
                            </div>
                            <div style="background: #fff5f0; border-radius: 12px; padding: 16px; border-left: 4px solid #FF5C00;">
                                <div style="font-size: 12px; font-weight: 600; color: #FF5C00; margin-bottom: 8px;">Calorias</div>
                                <div style="font-size: 28px; font-weight: 800; color: #1A1A1A;">347</div>
                                <div style="font-size: 12px; color: #999; margin-top: 4px;">kcal queimadas</div>
                            </div>
                            <div style="background: #fff5f0; border-radius: 12px; padding: 16px; border-left: 4px solid #FF5C00;">
                                <div style="font-size: 12px; font-weight: 600; color: #FF5C00; margin-bottom: 8px;">Duração</div>
                                <div style="font-size: 28px; font-weight: 800; color: #1A1A1A;">45</div>
                                <div style="font-size: 12px; color: #999; margin-top: 4px;">minutos</div>
                            </div>
                        </div>
                        <div style="border-top: 1px solid #e5e5e5; padding-top: 16px; margin-top: 16px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                <span style="font-size: 13px; color: #666; font-weight: 600;">FC Média</span>
                                <span style="font-size: 18px; font-weight: 800; color: #FF5C00;">132 bpm</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                <span style="font-size: 13px; color: #666; font-weight: 600;">Velocidade Média</span> 
                                <span style="font-size: 18px; font-weight: 800; color: #FF5C00;">16.7 km/h</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span style="font-size: 13px; color: #666; font-weight: 600;">Altitude Ganho</span>
                                <span style="font-size: 18px; font-weight: 800; color: #FF5C00;">245 m</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div style="position: sticky; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); border-top: 1px solid rgba(0, 0, 0, 0.1); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 0 20px 0; max-width: 390px; margin: 0 auto; width: 100%;">
                <a href="../tela-principal/index.html" style="flex: 1; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; transition: all 0.2s; color: #999;">
                    <i data-lucide="user" style="width: 24px; height: 24px;"></i> <span style="font-size: 11px; font-weight: 600;">Perfil</span>
                </a> 
                <a href="../tela-turma/index.html" style="flex: 1; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; transition: all 0.2s; color: #999;">
                    <i data-lucide="users" style="width: 24px; height: 24px;"></i>
                    <span style="font-size: 11px; font-weight: 600;">Turma</span> 
                </a>
                <button style="flex: 1; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; transition: all 0.2s; color: #FF5C00;">
                    <i data-lucide="bar-chart-2" style="width: 24px; height: 24px;"></i>
                    <span style="font-size: 11px; font-weight: 600;">Relatório</span>
                </button>
                <a href="../tela-desafios/index.html" style="flex: 1; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; transition: all 0.2s; color: #999;">
                    <i data-lucide="zap" style="width: 24px; height: 24px;"></i> <span style="font-size: 11px; font-weight: 600;">Desafios</span>
                </a>
                <a href="../tela-placar/index.html" style="flex: 1; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; transition: all 0.2s; color: #999;">
                    <i data-lucide="award" style="width: 24px; height: 24px;"></i>
                    <span style="font-size: 11px; font-weight: 600;">Placar</span>
                </a>
                <a href="../tela-login/index.html" style="flex: 1; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; transition: all 0.2s; color: #999;">
                    <i data-lucide="log-out" style="width: 24px; height: 24px;"></i>
                    <span style="font-size: 11px; font-weight: 600;">Sair</span>
                </a>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
