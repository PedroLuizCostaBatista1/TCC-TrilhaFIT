<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>TrilhaFIT - Login</title>
</head>
<body>
    <div class="app-wrapper bg-dots" style="background-color: #FFFFFF;">
        <div style="max-width: 390px; width: 100%; margin: 0 auto; padding: 40px 20px; min-height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div class="anim-in" style="text-align: center; margin-bottom: 28px;">
                <a href="../tela-boas-vindas/index.html" style="border: none; color: #1A1A1A; font-size: 24px; padding: 0; margin-bottom: 16px;">
                    <i data-lucide="chevron-left" style="width:24px;height:24px; margin: auto;"></i>
                </a>
                <h1 style="font-size: 26px; font-weight: 800; color: #1A1A1A; margin-bottom: 4px;">Bem-vindo de volta!</h1>
                <p style="font-size: 14px; color: rgba(0,0,0,0.5); font-weight: 500;">Entre em sua conta</p>
            </div>
            <form style="display: flex; flex-direction: column; gap: 14px; width: 100%;">
                <div class="anim-in anim-d1" style="position: relative;">
                    <div class="icon-wrap">
                        <i data-lucide="mail" style="width:20px;height:20px;"></i>
                    </div>
                    <input type="email" id="login-email" class="input-field" placeholder="Seu e-mail" required>
                </div>
                <div class="anim-in anim-d2" style="position: relative;">
                    <div class="icon-wrap">
                        <i data-lucide="lock" style="width:20px;height:20px;"></i>
                    </div>
                    <input type="password" id="login-password" class="input-field" placeholder="Senha" required>
                </div>
                <div class="anim-in anim-d3" style="margin-top: 6px;">
                    <a href="../tela-principal/index.html" class="submit-btn neon-glow" style="display: block; text-align: center;">
                        <span>Entrar</span>
                    </a>
                </div>
            </form>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
